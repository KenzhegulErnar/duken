<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Магазин «Көрші»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--g-bg:#F3F5F1;--g-surface:#FFFFFF;--g-ink:#17211C;--g-muted:#56635C;--g-line:#D6DDD5;--g-spruce:#1F5C4A;--g-on:#FFFFFF;--g-err:#B5531A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g-bg:#111714;--g-surface:#18201C;--g-ink:#E6ECE8;--g-muted:#9BA9A1;--g-line:#2D3832;--g-spruce:#6DC0A2;--g-on:#111714;--g-err:#F09A52;color-scheme:dark}}
:root[data-theme="dark"]{--g-bg:#111714;--g-surface:#18201C;--g-ink:#E6ECE8;--g-muted:#9BA9A1;--g-line:#2D3832;--g-spruce:#6DC0A2;--g-on:#111714;--g-err:#F09A52;color-scheme:dark}
body{background:var(--g-bg);color:var(--g-ink)}
#gate{min-height:80vh;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:40px;font-family:"Golos Text","Segoe UI",system-ui,sans-serif}
#gate form{width:100%;max-width:360px;background:var(--g-surface);border:1px solid var(--g-line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
#gate h1{margin:0;font-family:"Unbounded","Arial Black",sans-serif;font-size:1.6rem;color:var(--g-spruce)}
#gate p{margin:0;color:var(--g-muted);font-size:.92rem;line-height:1.5}
#gate label{font-size:.82rem;color:var(--g-muted)}
#gate input{font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--g-line);border-radius:8px;background:var(--g-bg);color:var(--g-ink);width:100%;box-sizing:border-box}
#gate button{font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--g-spruce);color:var(--g-on);cursor:pointer}
#gate button:disabled{opacity:.6;cursor:wait}
#gate :focus-visible{outline:2px solid var(--g-spruce);outline-offset:2px}
#gate-err{color:var(--g-err);font-size:.88rem;min-height:1.3em}
</style>

</head>
<body>
<div id="gate">
  <form id="gate-form" autocomplete="off">
    <h1>Көрші</h1>
    <p>Бизнес-план продуктового магазина. Документ защищён: введите код доступа.</p>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="gate-code">Код доступа</label>
      <input type="password" id="gate-code" required autofocus>
    </div>
    <button type="submit" id="gate-btn">Открыть</button>
    <div id="gate-err" role="alert"></div>
  </form>
</div>
<div id="app"></div>

  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
    base, {name:'AES-CBC', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-CBC', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
  const text = new TextDecoder().decode(plain);
  if(!text.startsWith('KORSHI1:')) throw new Error('bad');
  return text.slice(8);
}
document.getElementById('gate-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('gate-btn'), err = document.getElementById('gate-err');
  btn.disabled = true; btn.textContent = 'Проверяю…'; err.textContent = '';
  try{
    const html = await unlock(document.getElementById('gate-code').value);
    const app = document.getElementById('app');
    app.innerHTML = html;
    document.getElementById('gate').remove();
    app.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script'); s.textContent = old.textContent; old.replaceWith(s);
    });
    const h = location.hash.slice(1); if(h){ const t = document.getElementById(h); if(t) t.scrollIntoView(); }
  }catch(x){
    err.textContent = 'Неверный код. Проверьте раскладку и регистр букв.';
    btn.disabled = false; btn.textContent = 'Открыть';
  }
});
